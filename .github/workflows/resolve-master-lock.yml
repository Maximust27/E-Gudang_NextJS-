name: Resolve master import dependency lock

on:
  push:
    branches: [feat/master-import-labels]
    paths: [".github/workflows/resolve-master-lock.yml"]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.7.0"
      # Bundled npm avoids the npm 12 lock-only Tailwind optional bundle bug.
      - run: npm --version
      - name: Generate lockfile delta
        run: |
          cp package-lock.json /tmp/old-lock.json
          npm install --package-lock-only --ignore-scripts --save-exact exceljs@4.4.0 jsbarcode@3.12.3
          node --input-type=commonjs -e 'const fs=require("node:fs"); const a=JSON.parse(fs.readFileSync("/tmp/old-lock.json")),b=JSON.parse(fs.readFileSync("package-lock.json")); const changes=Object.fromEntries(Object.entries(b.packages).filter(([k,v])=>JSON.stringify(a.packages[k])!==JSON.stringify(v))); const removed=Object.keys(a.packages).filter(k=>!(k in b.packages)); const header={...b};delete header.packages; console.log("MASTER_LOCK_DELTA="+JSON.stringify({header,changes,removed}));'
      - name: Audit resolved dependencies
        run: npm audit --omit=dev
