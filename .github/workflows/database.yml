name: Database checks

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/**"
      - "lib/db-client.ts"
      - "lib/prisma.ts"
      - "prisma7.config.ts"
      - "package*.json"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: e_gudang_test
          MARIADB_USER: e_gudang
          MARIADB_PASSWORD: ci-local-only
          MARIADB_ROOT_PASSWORD: ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://e_gudang:ci-local-only@127.0.0.1:3306/e_gudang_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.7.0"
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Verify supported schema has no drift
        run: npx prisma migrate diff --config prisma7.config.ts --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run db:smoke
      - run: npm run db:status
